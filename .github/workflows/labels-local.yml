name: Sync labels (this repo)

on:
  workflow_dispatch:
    inputs:
      prune:
        description: Delete labels that are not in the manifests
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/labels-local.yml'
      - 'labels/**'

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          delete-other-labels: ${{ inputs.prune == true }}
          config-file: labels/common.yml
