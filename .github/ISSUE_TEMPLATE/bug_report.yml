name: Bug report
description: Report behavior that does not match the documentation
title: 'bug: '
labels: ['type/bug', 'state/needs-triage']
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The version of this repository's package you are on. Reproduce on the latest release before reporting.
      placeholder: 1.4.2
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What happens.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: The steps that lead to the current behavior.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A code snippet, a command, or a link to a public repository that reproduces the bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Runtime and operating system. For the CLI, paste the output of `npx hotcodepush doctor`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. No secrets, no tokens.
      render: shell
  - type: textarea
    id: related-issues
    attributes:
      label: Related issues
      description: Issues and discussions that may be related.
  - type: checkboxes
    id: before-submitting
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest version.
          required: true
        - label: I have searched the existing issues and discussions.
          required: true
        - label: I understand that issues without a reproduction are closed.
          required: true
